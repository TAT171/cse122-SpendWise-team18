<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tổng quan – SpendWise</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/ai.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="app-root" data-role="user" data-crumbs="Người dùng|Tổng quan"></div>

<template id="page-content">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px">
    <div>
      <h1 class="page-title">Tổng quan tài chính</h1>
      <p class="page-sub">Tháng 10/2026 · Cập nhật lúc 09:30</p>
    </div>
    <select class="btn" style="padding:9px 14px" onchange="toast('Đã đổi kỳ: '+this.value,'ok')">
      <option>Tháng này</option><option>Quý này</option><option>Năm nay</option>
    </select>
  </div>

<section class="grid g3" style="margin-bottom:16px" aria-label="Chỉ số tổng quan">
    <article class="stat">
      <div class="label">Số dư khả dụng <span class="badge-icon">▢</span></div>
      <div class="value" id="kpiBalance">0 đ</div>
    </article>
    <article class="stat">
      <div class="label">Tổng chi tháng <span class="badge-icon" style="background:#fdeaea;color:#e05252">✕</span></div>
      <div class="value" id="kpiTotalSpent">0 đ</div>
    </article>
    <article class="stat">
      <div class="label">Đã tiết kiệm <span class="badge-icon" style="background:#e4f6eb;color:#2e9e5b">↑</span></div>
      <div class="value" id="kpiSaved">0 đ</div>
    </article>
  </section>

  <div class="grid g2" style="margin-bottom:16px">
  <section class="card" aria-label="Biểu đồ chi tiêu 7 ngày">
    <header class="section-title">Chi tiêu 7 ngày</header>
    <div id="chart7Days" style="display:flex;align-items:flex-end;gap:14px;height:170px;padding:6px 4px 0">
    </div>
  </section>    
    <section class="card" aria-label="Ngân sách theo danh mục">
      <header class="section-title">Ngân sách theo danh mục</header>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Ăn uống</span><span>78%</span></div><div class="progress"><div class="bar er" style="width:78%"></div></div></div>
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Di chuyển</span><span>52%</span></div><div class="progress"><div class="bar ok" style="width:52%"></div></div></div>
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Mua sắm</span><span>91%</span></div><div class="progress"><div class="bar er" style="width:91%"></div></div></div>
      </div>
    </section>
  </div>

    <div class="grid g2" style="margin-bottom:16px">
  <section class="card" aria-label="Mục tiêu tài chính">
    <header class="section-title">Mục tiêu gần nhất <span class="badge info">2 mục tiêu</span></header>
    <div style="font-weight:600;margin-bottom:8px">Quỹ khẩn cấp</div>
    <div class="progress" style="margin-bottom:10px"><div class="bar ok" style="width:60%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#567a88">
      <span>60% hoàn thành · 18.000.000 / 30.000.000 đ</span>
      <span class="badge info">Còn 4 tháng</span>
    </div>
  </section>

  <section class="card" aria-label="Ghi chú từ huấn luyện viên">
    <div class="section-title">
      <span class="badge info" id="coachNoteCount">0 ghi chú</span>
    </div>
    <nav class="tabs" id="coachNoteTabs" role="tablist" aria-label="Danh sách ghi chú"></nav>

    <div id="coachNoteBody" role="tabpanel"></div>
  </section>    </div>
  <section class="ai-panel" aria-label="Phân tích chi tiêu bằng AI">
    <div class="ai-head">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>
      AI Spending Pattern Insight
    </div>
    <div id="aiDashBody">
      <button class="btn primary" id="runInsight" type="button">Phân tích dữ liệu chi tiêu</button>
    </div>
  </section>
</template>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
<script src="js/ai.js"></script>
<script src="js/user-dashboard.js"></script>
</body>
</html>
