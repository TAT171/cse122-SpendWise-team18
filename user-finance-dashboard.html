<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tổng quan – SpendWise</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/ai.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="app-root" data-role="user" data-crumbs="Người dùng|Tổng quan"></div>

<template id="page-content">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px">
    <div>
      <h1 class="page-title">Tổng quan tài chính</h1>
      <p class="page-sub">Tháng 10/2026 · Cập nhật lúc 09:30</p>
    </div>
    <select class="btn" style="padding:9px 14px" onchange="toast('Đã đổi kỳ: '+this.value,'ok')">
      <option>Tháng này</option><option>Quý này</option><option>Năm nay</option>
    </select>
  </div>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat"><div class="label">Số dư khả dụng <span class="badge-icon">▢</span></div><div class="value">18.450.000 đ</div><div class="delta up">+8% so với tháng trước</div></div>
    <div class="stat"><div class="label">Tổng chi tháng <span class="badge-icon" style="background:#fdeaea;color:#e05252">✕</span></div><div class="value">12.680.000 đ</div><div class="delta down">Đã dùng 63% ngân sách</div></div>
    <div class="stat"><div class="label">Đã tiết kiệm <span class="badge-icon" style="background:#e4f6eb;color:#2e9e5b">↑</span></div><div class="value">4.200.000 đ</div><div class="delta up">+600.000 đ so với kế hoạch</div></div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card">
      <div class="section-title">Chi tiêu 7 ngày <span style="font-size:13px;color:#567a88">12.680.000 đ</span></div>
      <div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding:6px 4px 0">
        <div style="flex:1;text-align:center"><div style="height:40px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T2</div>
        <div style="flex:1;text-align:center"><div style="height:70px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T3</div>
        <div style="flex:1;text-align:center"><div style="height:52px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T4</div>
        <div style="flex:1;text-align:center"><div style="height:88px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T5</div>
        <div style="flex:1;text-align:center"><div style="height:74px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T6</div>
        <div style="flex:1;text-align:center"><div style="height:110px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>T7</div>
        <div style="flex:1;text-align:center"><div style="height:68px;background:#bfeaf4;border-radius:6px 6px 0 0;margin-bottom:6px"></div>CN</div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px"><span class="badge er">Cao nhất: Thứ 7</span><span class="badge ok">-6% so tuần trước</span></div>
    </div>
    <div class="card">
      <div class="section-title">Ngân sách theo danh mục <a style="color:#4db8d4;font-size:13px;font-weight:500" onclick="toast('Mở ngân sách chi tiết','wr')">Xem tất cả</a></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Ăn uống</span><span>78%</span></div><div class="progress"><div class="bar er" style="width:78%"></div></div></div>
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Di chuyển</span><span>52%</span></div><div class="progress"><div class="bar ok" style="width:52%"></div></div></div>
        <div><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px"><span>Mua sắm</span><span>91%</span></div><div class="progress"><div class="bar er" style="width:91%"></div></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Mục tiêu gần nhất <span class="badge info">2 mục tiêu</span></div>
    <div style="font-weight:600;margin-bottom:8px">Quỹ khẩn cấp</div>
    <div class="progress" style="margin-bottom:10px"><div class="bar ok" style="width:60%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#567a88">
      <span>60% hoàn thành · 18.000.000 / 30.000.000 đ</span>
      <span class="badge info">Còn 4 tháng</span>
    </div>
  </div>

  <div class="ai-panel">
    <div class="ai-head">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>
      AI Spending Pattern Insight
    </div>
    <div id="aiDashBody">
      <button class="btn primary" id="runInsight" type="button">Phân tích dữ liệu chi tiêu</button>
    </div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
<script src="js/ai.js"></script>
<script src="js/user-dashboard.js"></script>
</body>
</html>
