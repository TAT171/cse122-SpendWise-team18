<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt tài nguyên – SpendWise</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root" data-role="moderator" data-crumbs="Kiểm duyệt viên|Duyệt tài nguyên"></div>

<template id="page-content">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px">
    <div><h1 class="page-title">Duyệt tài nguyên</h1><p class="page-sub">Kiểm tra nội dung trước khi xuất bản cho người dùng.</p></div>
    <select class="btn" id="rvFilter" style="padding:9px 14px" onchange="window.filterModQueue(this.value)">
        <option value="all">Tất cả</option>
        <option value="pending">Chờ duyệt</option>
        <option value="approved">Đã duyệt</option>
        <option value="rejected">Từ chối</option>
    </select>
  </div>
  <div class="grid g3" style="margin-bottom:20px">
    <div class="card">
<div class="section-title">Hàng đợi <span class="badge muted" id="queueCount">0 nội dung</span></div>      <div style="display:flex;flex-direction:column;gap:10px" id="modQueue"></div>
    </div>
    <div class="card">
      <span class="badge info">Ngân sách</span><span class="badge er" style="float:right">Chờ duyệt</span>
      <h2 style="font-size:20px;margin:12px 0 10px" id="rvTitle"></h2>
      <p style="color:#567a88;font-size:13.5px;line-height:1.7" id="rvBody"></p>
      <div style="margin-top:16px">
        <div style="font-weight:600;margin-bottom:8px">Gợi ý thực hiện</div>
        <ol id="rvSteps" style="padding-left:20px;line-height:1.8;font-size:13.5px">
        </ol>
      </div>
      <div class="card">
      <div class="section-title">Checklist kiểm duyệt</div>
      <ul style="display:flex;flex-direction:column;gap:12px;font-size:13.5px;margin-bottom:16px">
        <li style="display:flex;justify-content:space-between">Chính xác <span class="badge ok">✓</span></li>
        <li style="display:flex;justify-content:space-between">An toàn <span class="badge ok">✓</span></li>
        <li style="display:flex;justify-content:space-between">Dễ hiểu <span class="badge muted">○</span></li>
      </ul>
      <div id="rvActionButtons" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn primary" onclick="window.handleModAction('approved')">Duyệt</button>
        <button class="btn danger" onclick="window.handleModAction('rejected')">Từ chối</button>
      </div>    
    </div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
<script src="js/moderator-review.js"></script>
</body>
</html>
