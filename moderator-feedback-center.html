<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trung tâm phản hồi – SpendWise</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root" data-role="moderator" data-crumbs="Kiểm duyệt viên|Trung tâm phản hồi"></div>

<template id="page-content">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px">
    <div><h1 class="page-title">Feedback Center</h1><p class="page-sub">Xử lý phản hồi người dùng và báo cáo AI.</p></div>
    <button class="btn" onclick="toast('Đang xuất báo cáo…','ok')">Xuất báo cáo</button>
  </div>
  <div class="grid g2">
    <div class="card">
      <div class="section-title">Danh sách <span class="badge muted" id="fbCount">0 mục</span></div><div style="display:flex;flex-direction:column;gap:10px" id="fbList"></div>
    </div>
    <div class="card" id="fbDetailPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span style="font-size:12px;color:#567a88" id="fbCode"></span>
    <span class="badge wr" id="fbStatus"></span>
      </div>
      <h2 style="font-size:18px;margin-bottom:8px" id="fbTitle"></h2>
      <p style="color:#567a88;font-size:13.5px;line-height:1.7" id="fbDesc"></p>
      <div style="margin-top:14px;font-size:13px;color:#567a88;display:flex;flex-direction:column;gap:6px">
        <div>● 09:12 · Người dùng gửi báo cáo</div>
        <div>● 09:18 · Hệ thống ghi nhận log AI</div>
        <div>● 09:30 · Đã giao cho Lan Anh</div>
      </div>
      <div class="field" style="margin-top:16px"><label>Trả lời người dùng</label><textarea id="fbReply" placeholder="Nhập phản hồi..."></textarea></div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <select class="btn" style="padding:9px 14px" onchange="toast('Đã giao cho: '+this.value,'ok')"><option>Giao cho: Lan Anh</option><option>Tôi xử lý</option></select>
        <button class="btn primary" onclick="handleResolveFB()">Giải quyết</button>
        <button class="btn" onclick="toast('Đã lưu trữ phản hồi','wr')">Lưu trữ</button>
      </div>
    </div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/layout.js"></script>
<script src="js/moderator-feedback.js"></script>
</body>
</html>
